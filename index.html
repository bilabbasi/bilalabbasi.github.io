<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/favicon_ba.png">
    <title>bilal abbasi</title>

    <!-- SEO Meta Tags -->
    <meta name="description"
        content="Personal website and gateway for Bilal Abbasi. Systems engineering, research, and culinary explorations.">
    <meta name="author" content="Bilal Abbasi">
    <meta name="robots" content="index, follow">

    <!-- Stylesheet: Controls how the website looks -->
    <link rel="stylesheet" href="index.css">

    <!-- Configuration Data -->
    <script src="config.js"></script>

    <!-- Loader & Typewriter Script -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const config = (typeof GATEWAY_CONFIG !== 'undefined') ? GATEWAY_CONFIG : {
                name: "hi, i'm bilal",
                links: [
                    { label: "professional", url: "professional.html" },
                    { label: "kitchen", url: "kitchen.html" }
                ]
            };

            document.title = config.name;

            const linksContainer = document.getElementById("gateway-links");
            if (linksContainer && config.links && config.links.length > 0) {
                linksContainer.innerHTML = config.links.map((link, index) => {
                    const extraClass = link.url.includes("kitchen") ? "gateway-link-kitchen" : "gateway-link-professional";
                    const linkHtml = `<a href="${link.url}" class="gateway-link ${extraClass}">${link.label}</a>`;
                    return index < config.links.length - 1
                        ? `${linkHtml}<span class="gateway-divider">/</span>`
                        : linkHtml;
                }).join("");
            }

            const textEl = document.getElementById("gateway-text");
            const cursorEl = document.getElementById("gateway-cursor");
            const textToType = config.name || "hi, i'm bilal";

            const matchIndex = textToType.toLowerCase().indexOf("bilal");
            const matchLength = "bilal".length;

            const prefixSpan = document.createElement("span");
            const accentSpan = document.createElement("span");
            accentSpan.className = "gateway-name-accent";
            const suffixSpan = document.createElement("span");

            textEl.appendChild(prefixSpan);
            textEl.appendChild(accentSpan);
            textEl.appendChild(suffixSpan);

            let charIndex = 0;

            function typeChar() {
                if (charIndex < textToType.length) {
                    const char = textToType.charAt(charIndex);
                    if (matchIndex !== -1 && charIndex >= matchIndex && charIndex < matchIndex + matchLength) {
                        accentSpan.textContent += char;
                    } else if (matchIndex !== -1 && charIndex >= matchIndex + matchLength) {
                        suffixSpan.textContent += char;
                    } else {
                        prefixSpan.textContent += char;
                    }

                    charIndex++;
                    let delay = 70 + Math.random() * 35;
                    if (char === ',') delay += 220;
                    setTimeout(typeChar, delay);
                } else {
                    if (cursorEl) cursorEl.classList.add("finished");
                    if (linksContainer) linksContainer.classList.add("visible");
                }
            }

            setTimeout(typeChar, 350);
        });
    </script>
</head>

<body>

    <div class="gateway-wrapper">

        <main class="gateway-card">
            <h1 class="gateway-title" id="gateway-title"><span id="gateway-text"></span><span class="typewriter-cursor" id="gateway-cursor">|</span></h1>
            <nav class="gateway-links" id="gateway-links">
                <a href="professional.html" class="gateway-link gateway-link-professional">professional</a>
                <span class="gateway-divider">/</span>
                <a href="kitchen.html" class="gateway-link gateway-link-kitchen">kitchen</a>
            </nav>
        </main>

        <footer class="footer gateway-footer">
            <p>&copy; 2026 Bilal Abbasi. All rights reserved.</p>
        </footer>

    </div>

</body>

</html>
