<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/favicon_ba.png">
    <title>bilal abbasi</title>

    <!-- SEO Meta Tags -->
    <meta name="description"
        content="Personal website and gateway for Bilal Abbasi. Systems engineering, research, and culinary explorations.">
    <meta name="author" content="Bilal Abbasi">
    <meta name="robots" content="index, follow">

    <!-- Stylesheet: Controls how the website looks -->
    <link rel="stylesheet" href="index.css">

    <!-- Configuration Data -->
    <script src="config.js"></script>

    <!-- Page Loader & Revolving Door Controller -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const config = (typeof GATEWAY_CONFIG !== 'undefined') ? GATEWAY_CONFIG : {
                name: "hi, i'm bilal",
                links: [
                    { label: "professional", url: "professional/" },
                    { label: "kitchen", url: "kitchen/" }
                ]
            };

            if (config.name) {
                document.title = config.name;
            }

            // Render navigation links dynamically from configuration
            const linksContainer = document.getElementById("gateway-links");
            if (linksContainer && config.links && config.links.length > 0) {
                linksContainer.innerHTML = config.links.map((link, index) => {
                    const isKitchen = link.url.includes("kitchen");
                    const extraClass = isKitchen ? "gateway-link-kitchen" : "gateway-link-professional";
                    const doorKey = isKitchen ? "kitchen" : "professional";
                    const linkHtml = `<a href="${link.url}" class="gateway-link ${extraClass}" data-door="${doorKey}">${link.label}</a>`;
                    return index < config.links.length - 1
                        ? `${linkHtml}<span class="gateway-divider">/</span>`
                        : linkHtml;
                }).join("");
            }

            // =====================================================================
            // 3D Vertical Revolving Door Controller
            // =====================================================================
            // Beside "bilal", a 4-faced cylinder vertically revolves along the X-axis:
            // - Hovering "professional" revolves forward to reveal "the scientist" in slate grey.
            // - Hovering "kitchen" revolves forward to reveal "the cook" in terracotta.
            // - The greeting "hi, i'm bilal" stays 100% stationary (the door is absolutely positioned).
            // - Moving between the two links continuously rolls forward in the same direction.
            // - Leaving the links revolves forward into a blank face and fades out.
            const doorEl = document.getElementById("gateway-door");
            const cylinderEl = document.getElementById("door-cylinder");
            let currentStep = 0;
            let currentState = "idle"; // "idle" | "professional" | "kitchen"
            let leaveTimer = null;

            const doorConfig = (config && config.door) ? config.door : {
                professional: { text: ", the scientist", color: "#4b5563" },
                kitchen: { text: ", the cook", color: "#b83b14" }
            };

            function setDoorState(newState) {
                if (newState === currentState) return;
                currentState = newState;

                if (leaveTimer) {
                    clearTimeout(leaveTimer);
                    leaveTimer = null;
                }

                if (!doorEl || !cylinderEl) return;

                if (newState === "idle") {
                    // Step forward to a clean blank face and fade out
                    currentStep++;
                    const targetFaceIdx = currentStep % 4;
                    const targetFace = document.getElementById(`door-face-${targetFaceIdx}`);
                    if (targetFace) {
                        targetFace.textContent = "";
                        targetFace.className = `door-face face-${targetFaceIdx} face-blank`;
                    }
                    cylinderEl.style.transform = `rotateX(${-currentStep * 90}deg)`;
                    doorEl.classList.remove("is-active");
                } else {
                    const item = doorConfig[newState];
                    if (!item) return;

                    currentStep++;
                    const targetFaceIdx = currentStep % 4;
                    const targetFace = document.getElementById(`door-face-${targetFaceIdx}`);
                    if (targetFace) {
                        const rawText = item.text || "";
                        const cleanText = rawText.replace(/^[,\s]+/, "");
                        targetFace.innerHTML = `<span class="door-comma">,</span> <span class="door-text">${cleanText}</span>`;
                        targetFace.style.color = item.color;
                        const extraClass = newState === "kitchen" ? "face-kitchen" : "face-professional";
                        targetFace.className = `door-face face-${targetFaceIdx} ${extraClass}`;
                    }
                    cylinderEl.style.transform = `rotateX(${-currentStep * 90}deg)`;
                    doorEl.classList.add("is-active");
                }
            }

            // Expose globally for inspection and test harnesses
            window.setDoorState = setDoorState;

            // Wire hover listeners with a 100ms grace period on mouseleave to avoid flicker
            if (linksContainer) {
                linksContainer.addEventListener("mouseover", (event) => {
                    const link = event.target.closest("a[data-door]");
                    if (link) {
                        const doorKey = link.getAttribute("data-door");
                        setDoorState(doorKey);
                    }
                });

                linksContainer.addEventListener("mouseleave", () => {
                    leaveTimer = setTimeout(() => {
                        setDoorState("idle");
                    }, 100);
                });
            }

            // Preview query param for headless verification (?state=professional or ?state=kitchen)
            const urlParams = new URLSearchParams(window.location.search);
            const previewState = urlParams.get("state");
            if (previewState && (previewState === "professional" || previewState === "kitchen")) {
                setDoorState(previewState);
            }
        });
    </script>
</head>

<body>

    <div class="gateway-wrapper">

        <main class="gateway-card">
            <h1 class="gateway-title" id="gateway-title">
                <span class="gateway-greeting" id="gateway-greeting">hi, i'm <span class="gateway-name-accent">bilal</span></span>
                <span class="gateway-door" id="gateway-door" aria-hidden="true">
                    <span class="door-cylinder" id="door-cylinder">
                        <span class="door-face face-0" id="door-face-0"></span>
                        <span class="door-face face-1" id="door-face-1"></span>
                        <span class="door-face face-2" id="door-face-2"></span>
                        <span class="door-face face-3" id="door-face-3"></span>
                    </span>
                </span>
            </h1>
            <nav class="gateway-links" id="gateway-links">
                <a href="professional/" class="gateway-link gateway-link-professional" data-door="professional">professional</a>
                <span class="gateway-divider">/</span>
                <a href="kitchen/" class="gateway-link gateway-link-kitchen" data-door="kitchen">kitchen</a>
            </nav>
        </main>

        <footer class="footer gateway-footer">
            <p>&copy; 2026 Bilal Abbasi. All rights reserved.</p>
        </footer>

    </div>

</body>

</html>
