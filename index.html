<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/favicon_ba.png">
    <title>Bilal Abbasi</title>

    <!-- SEO Meta Tags -->
    <meta name="description" content="Personal website and gateway for Bilal Abbasi. Systems engineering, research, and culinary explorations.">
    <meta name="author" content="Bilal Abbasi">
    <meta name="robots" content="index, follow">

    <!-- Stylesheet: Controls how the website looks -->
    <link rel="stylesheet" href="index.css">

    <!-- Configuration Data -->
    <script src="config.js"></script>

    <!-- Loader Script -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const config = (typeof GATEWAY_CONFIG !== 'undefined') ? GATEWAY_CONFIG : {
                name: "Bilal Abbasi",
                links: [
                    { label: "professional", url: "professional.html" },
                    { label: "kitchen", url: "kitchen.html" }
                ]
            };

            document.title = config.name;
            const titleEl = document.getElementById("gateway-title");
            if (titleEl) {
                titleEl.textContent = config.name;
            }

            const linksContainer = document.getElementById("gateway-links");
            if (linksContainer && config.links && config.links.length > 0) {
                linksContainer.innerHTML = config.links.map((link, index) => {
                    const extraClass = link.url.includes("kitchen") ? "gateway-link-kitchen" : "gateway-link-professional";
                    const linkHtml = `<a href="${link.url}" class="gateway-link ${extraClass}">${link.label}</a>`;
                    return index < config.links.length - 1 
                        ? `${linkHtml}<span class="gateway-divider">/</span>` 
                        : linkHtml;
                }).join("");
            }
        });
    </script>
</head>

<body>

    <div class="gateway-wrapper">

        <main class="gateway-card">
            <h1 class="gateway-title" id="gateway-title">Bilal Abbasi</h1>
            <nav class="gateway-links" id="gateway-links">
                <a href="professional.html" class="gateway-link gateway-link-professional">professional</a>
                <span class="gateway-divider">/</span>
                <a href="kitchen.html" class="gateway-link gateway-link-kitchen">kitchen</a>
            </nav>
        </main>

        <footer class="footer gateway-footer">
            <p>&copy; 2026 Bilal Abbasi. All rights reserved.</p>
        </footer>

    </div>

</body>

</html>
