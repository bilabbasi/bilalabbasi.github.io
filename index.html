<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/favicon_ba.png">
    <title>bilal abbasi</title>

    <!-- SEO Meta Tags -->
    <meta name="description"
        content="Personal website and gateway for Bilal Abbasi. Systems engineering, research, and culinary explorations.">
    <meta name="author" content="Bilal Abbasi">
    <meta name="robots" content="index, follow">

    <!-- Fonts: Lora & Inter (loaded via <link> without Urdu font on English-only gateway) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap">

    <!-- Stylesheets: Base tokens/typography + gateway cover layout -->
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="gateway.css">

    <!-- Configuration Data -->
    <script src="config.js"></script>

    <!-- Page Loader & Faded Flat Reel Controller -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const config = (typeof GATEWAY_CONFIG !== 'undefined') ? GATEWAY_CONFIG : {
                name: "hi, i'm bilal",
                links: [
                    { label: "office", url: "office/", target: "office" },
                    { label: "kitchen", url: "kitchen/", target: "kitchen" }
                ],
                reel: {
                    colors: {
                        office: "#3d68a8",
                        kitchen: "#b83b14"
                    }
                }
            };

            if (config.name) {
                document.title = config.name;
            }

            // Render navigation links dynamically from configuration
            const linksContainer = document.getElementById("gateway-links");
            if (linksContainer && config.links && config.links.length > 0) {
                linksContainer.innerHTML = config.links.map((link, index) => {
                    const isKitchen = link.url.includes("kitchen");
                    const extraClass = isKitchen ? "gateway-link-kitchen" : "gateway-link-office";
                    const targetKey = isKitchen ? "kitchen" : "office";
                    const linkHtml = `<a href="${link.url}" class="gateway-link ${extraClass}" data-reel="${targetKey}" data-door="${targetKey}">${link.label}</a>`;
                    return index < config.links.length - 1
                        ? `${linkHtml}<span class="gateway-divider" aria-hidden="true">/</span>`
                        : linkHtml;
                }).join("");
            }

            // =====================================================================
            // Circular Infinite Reel Controller & Easter Egg Scroller
            // =====================================================================
            const reelEl = document.getElementById("gateway-reel");
            const trackEl = document.getElementById("reel-track");
            const anchorEl = document.querySelector(".reel-baseline-anchor");
            const restingPhraseEl = document.getElementById("reel-resting-phrase");
            if (restingPhraseEl && config.reel && config.reel.restingLabel) {
                restingPhraseEl.textContent = config.reel.restingLabel;
            }
            if (reelEl && config.reel && config.reel.evaporation) {
                const ev = config.reel.evaporation;
                if (typeof ev.duration === "number") {
                    reelEl.style.setProperty("--evap-duration", `${ev.duration}ms`);
                }
                if (typeof ev.revealDuration === "number") {
                    reelEl.style.setProperty("--reel-reveal-duration", `${ev.revealDuration}ms`);
                }
                if (typeof ev.blur === "number") {
                    reelEl.style.setProperty("--evap-blur", `${ev.blur}px`);
                }
                if (typeof ev.rise === "number") {
                    reelEl.style.setProperty("--evap-rise", `${-Math.abs(ev.rise)}px`);
                }
                if (typeof ev.spread === "number") {
                    reelEl.style.setProperty("--evap-spread", `${ev.spread}em`);
                }
            }

            const items = (config.reel && Array.isArray(config.reel.items)) ? config.reel.items : [];
            const itemColors = {};
            items.forEach(it => {
                if (it.id && it.color) itemColors[it.id] = it.color;
            });
            const kitchenColor = itemColors.cook || (config.reel && config.reel.colors && config.reel.colors.kitchen) || "#b83b14";
            const officeColor = itemColors.scientist || (config.reel && config.reel.colors && config.reel.colors.office) || "#2b4162";
            document.documentElement.style.setProperty("--gateway-kitchen-color", kitchenColor);
            document.documentElement.style.setProperty("--gateway-office-color", officeColor);

            const N = items.length;
            const cookIndex = items.findIndex(it => it.id === "cook" || it.target === "kitchen");
            const scientistIndex = items.findIndex(it => it.id === "scientist" || it.target === "office");

            // Build 3 sets of items for seamless circular infinite wrapping
            let trackHtml = "";
            for (let c = 0; c < 3; c++) {
                items.forEach((item, idx) => {
                    const isMiddleCycle = (c === 1);
                    const originalIdAttr = isMiddleCycle ? ` id="reel-item-${item.id}"` : "";
                    trackHtml += `<span class="reel-item reel-${item.id}"${originalIdAttr} data-item-id="${item.id}" data-cycle="${c}" data-index="${idx}">${item.label}</span>`;
                });
            }
            if (trackEl) {
                trackEl.innerHTML = trackHtml;
            }

            const viewportEl = reelEl ? reelEl.querySelector(".reel-viewport") : null;

            function getHorizontalMetrics() {
                const viewportW = (viewportEl && viewportEl.clientWidth) || (reelEl && reelEl.clientWidth) || 720;
                const viewportCenterX = viewportW / 2;
                const children = trackEl ? trackEl.children : [];
                let cycleWidth = 0;
                if (children.length >= 2 * N && N > 0) {
                    cycleWidth = children[N].offsetLeft - children[0].offsetLeft;
                }
                if (!cycleWidth || cycleWidth <= 0) {
                    cycleWidth = Math.max(1, N) * 280;
                }
                const avgStep = cycleWidth / Math.max(1, N);
                const copy1Origin = (children.length > N ? children[N].offsetLeft : cycleWidth) - viewportCenterX;
                return { viewportW, viewportCenterX, cycleWidth, avgStep, copy1Origin, children };
            }

            function getItemCenterX(childIdx, metrics) {
                const { children, avgStep } = metrics;
                if (children && children[childIdx]) {
                    const el = children[childIdx];
                    return el.offsetLeft + el.offsetWidth / 2;
                }
                return (childIdx + 0.5) * avgStep;
            }

            // Target translateX offsets (center of target item aligned to viewportCenterX)
            function getTargetOffset(state) {
                const m = getHorizontalMetrics();
                const cIdx = (cookIndex >= 0 ? cookIndex : 1);
                const sIdx = (scientistIndex >= 0 ? scientistIndex : 2);
                if (state === "kitchen") {
                    return getItemCenterX(N + cIdx, m) - m.viewportCenterX;
                } else if (state === "office") {
                    return getItemCenterX(N + sIdx, m) - m.viewportCenterX;
                } else {
                    // Resting: midpoint between cook and scientist
                    const midCenter = (getItemCenterX(N + cIdx, m) + getItemCenterX(N + sIdx, m)) / 2;
                    return midCenter - m.viewportCenterX;
                }
            }

            // Preview query param for headless verification (?state=office, ?state=kitchen, ?state=resting, ?item=cyclist, etc.)
            const urlParams = new URLSearchParams(window.location.search);
            const previewState = urlParams.get("state");
            const previewItem = urlParams.get("item");

            let initialTarget = "resting";
            if (previewState && (previewState === "office" || previewState === "kitchen" || previewState === "resting")) {
                initialTarget = previewState;
            }

            let currentState = initialTarget;
            let currentT = getTargetOffset(initialTarget);
            const cardEl = document.querySelector(".gateway-card");
            if (cardEl) {
                cardEl.setAttribute("data-state", currentState);
            }

            if (previewItem) {
                const itemIdx = items.findIndex(it => it.id === previewItem);
                if (itemIdx >= 0) {
                    const m = getHorizontalMetrics();
                    currentT = getItemCenterX(N + itemIdx, m) - m.viewportCenterX;
                    currentState = "scrolling";
                }
            }

            function evaporateRestingPhrase() {
                if (reelEl && !reelEl.classList.contains("has-evaporated")) {
                    reelEl.classList.add("has-evaporated");
                }
            }

            if (reelEl) {
                reelEl.setAttribute("data-state", currentState);
                if (currentState !== "resting") {
                    evaporateRestingPhrase();
                }
            }

            let leaveTimer = null;
            let animRafId = null;
            let momentumRafId = null;

            function cancelAnimation() {
                if (animRafId) {
                    cancelAnimationFrame(animRafId);
                    animRafId = null;
                }
            }

            function cancelMomentum() {
                if (momentumRafId) {
                    cancelAnimationFrame(momentumRafId);
                    momentumRafId = null;
                }
            }

            function renderTrack() {
                if (!trackEl) return;
                const m = getHorizontalMetrics();
                const C = m.cycleWidth;
                const minWrap = m.copy1Origin;
                const maxWrap = m.copy1Origin + C;

                // Circular wrap currentT into Copy 1 range [copy1Origin, copy1Origin + C)
                while (currentT < minWrap) currentT += C;
                while (currentT >= maxWrap) currentT -= C;

                trackEl.style.transform = `translateX(${-currentT}px)`;

                const children = m.children;
                const totalChildren = children.length;

                for (let i = 0; i < totalChildren; i++) {
                    const el = children[i];
                    const itemCenterX = el.offsetLeft + el.offsetWidth / 2;
                    const screenDist = itemCenterX - currentT - m.viewportCenterX;
                    const d = Math.abs(screenDist) / m.avgStep;

                    if (d < 0.28) {
                        el.style.opacity = "1";
                        const itemId = el.getAttribute("data-item-id");
                        if (itemId === "cook" && currentState === "kitchen") {
                            el.style.color = kitchenColor;
                        } else if (itemId === "scientist" && currentState === "office") {
                            el.style.color = officeColor;
                        } else {
                            el.style.color = "var(--text-title, #1e293b)";
                        }
                    } else if (d < 0.92) {
                        el.style.opacity = "0.40";
                        el.style.color = "var(--text-muted, #6b7280)";
                    } else if (d < 1.95) {
                        el.style.opacity = "0.18";
                        el.style.color = "var(--text-muted, #6b7280)";
                    } else {
                        el.style.opacity = "0";
                        el.style.color = "var(--text-muted, #6b7280)";
                    }
                }
            }

            function animateTo(targetT, duration = 460, onComplete = null) {
                cancelAnimation();
                cancelMomentum();
                const C = getHorizontalMetrics().cycleWidth;

                // Pick shortest direction around circle
                let delta = ((targetT - currentT) % C + C * 1.5) % C - 0.5 * C;
                const startT = currentT;
                const endT = currentT + delta;
                const startTime = performance.now();

                function step(now) {
                    const elapsed = now - startTime;
                    const progress = Math.min(1, elapsed / duration);
                    // Quintic smooth cubic bezier easing (0.22, 1, 0.36, 1)
                    const t = 1 - Math.pow(1 - progress, 3);
                    currentT = startT + (endT - startT) * t;
                    renderTrack();

                    if (progress < 1) {
                        animRafId = requestAnimationFrame(step);
                    } else {
                        animRafId = null;
                        currentT = endT;
                        renderTrack();
                        if (onComplete) onComplete();
                    }
                }

                animRafId = requestAnimationFrame(step);
            }

            function setReelState(newState) {
                if (!newState || newState === "idle") {
                    newState = "resting";
                }
                currentState = newState;
                if (newState !== "resting") {
                    evaporateRestingPhrase();
                }

                if (leaveTimer) {
                    clearTimeout(leaveTimer);
                    leaveTimer = null;
                }

                if (reelEl) {
                    reelEl.setAttribute("data-state", newState);
                }
                if (cardEl) {
                    cardEl.setAttribute("data-state", newState);
                }

                const targetT = getTargetOffset(newState);
                animateTo(targetT, 460);
            }

            // Expose globally for tests and inspectability
            window.setReelState = setReelState;
            window.setDoorState = setReelState; // Backward compatibility alias

            // =====================================================================
            // Free-Scroll & Magnetic Snap Physics (Easter Egg)
            // =====================================================================
            let velocity = 0;
            let isDragging = false;
            let touchStartX = 0;
            let lastTouchX = 0;
            let lastTouchTime = 0;

            function snapToNearest() {
                const m = getHorizontalMetrics();
                const C = m.cycleWidth;
                const cIdx = (cookIndex >= 0 ? cookIndex : 1);
                const sIdx = (scientistIndex >= 0 ? scientistIndex : 2);
                const midTarget = (getItemCenterX(N + cIdx, m) + getItemCenterX(N + sIdx, m)) / 2 - m.viewportCenterX;

                const candidateTargets = [midTarget];
                for (let k = 0; k < N; k++) {
                    candidateTargets.push(getItemCenterX(N + k, m) - m.viewportCenterX);
                }

                let bestTarget = null;
                let minDelta = Infinity;

                candidateTargets.forEach(candTarget => {
                    let delta = ((candTarget - currentT) % C + C * 1.5) % C - 0.5 * C;
                    if (Math.abs(delta) < Math.abs(minDelta)) {
                        minDelta = delta;
                        bestTarget = currentT + delta;
                    }
                });

                if (bestTarget !== null) {
                    animateTo(bestTarget, 240);
                }
            }

            const wheelSensitivity = (config.reel && typeof config.reel.wheelSensitivity === "number")
                ? config.reel.wheelSensitivity
                : 0.35;
            const friction = (config.reel && typeof config.reel.friction === "number")
                ? config.reel.friction
                : 0.92;

            function startMomentum() {
                cancelMomentum();
                cancelAnimation();

                function physicsStep() {
                    currentT += velocity;
                    velocity *= friction;
                    renderTrack();

                    if (Math.abs(velocity) > 0.35) {
                        momentumRafId = requestAnimationFrame(physicsStep);
                    } else {
                        momentumRafId = null;
                        snapToNearest();
                    }
                }

                momentumRafId = requestAnimationFrame(physicsStep);
            }

            if (reelEl) {
                // Start one-way evaporation as soon as the cursor touches the resting phrase
                reelEl.addEventListener("mouseenter", () => {
                    if (isNavigating) return;
                    evaporateRestingPhrase();
                });

                // Wheel / Trackpad listener (supports both horizontal swipe and vertical mouse wheel)
                reelEl.addEventListener("wheel", (e) => {
                    if (isNavigating) return;
                    e.preventDefault();
                    evaporateRestingPhrase();
                    cancelAnimation();
                    cancelMomentum();
                    currentState = "scrolling";
                    reelEl.setAttribute("data-state", "scrolling");
                    if (cardEl) cardEl.setAttribute("data-state", "scrolling");

                    const primaryDelta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
                    velocity += primaryDelta * wheelSensitivity * 2.2;
                    const maxVel = getHorizontalMetrics().avgStep * 0.9;
                    if (velocity > maxVel) velocity = maxVel;
                    if (velocity < -maxVel) velocity = -maxVel;

                    startMomentum();
                }, { passive: false });

                // Touch listeners (Mobile horizontal swipe)
                reelEl.addEventListener("touchstart", (e) => {
                    if (isNavigating || e.touches.length !== 1) return;
                    evaporateRestingPhrase();
                    cancelAnimation();
                    cancelMomentum();
                    currentState = "scrolling";
                    reelEl.setAttribute("data-state", "scrolling");
                    if (cardEl) cardEl.setAttribute("data-state", "scrolling");

                    touchStartX = e.touches[0].clientX;
                    lastTouchX = touchStartX;
                    lastTouchTime = performance.now();
                    isDragging = true;
                    velocity = 0;
                }, { passive: true });

                reelEl.addEventListener("touchmove", (e) => {
                    if (!isDragging || e.touches.length !== 1) return;
                    const touchX = e.touches[0].clientX;
                    const deltaX = lastTouchX - touchX;
                    const now = performance.now();
                    const dt = Math.max(1, now - lastTouchTime);
                    velocity = (deltaX / dt) * 16;
                    lastTouchX = touchX;
                    lastTouchTime = now;

                    currentT += deltaX;
                    renderTrack();
                }, { passive: true });

                reelEl.addEventListener("touchend", () => {
                    if (!isDragging) return;
                    isDragging = false;
                    startMomentum();
                });

                reelEl.addEventListener("touchcancel", () => {
                    if (!isDragging) return;
                    isDragging = false;
                    startMomentum();
                });

                // Mouse drag listeners (Desktop horizontal drag)
                reelEl.addEventListener("mousedown", (e) => {
                    if (isNavigating || e.button !== 0) return;
                    evaporateRestingPhrase();
                    cancelAnimation();
                    cancelMomentum();
                    currentState = "scrolling";
                    reelEl.setAttribute("data-state", "scrolling");
                    if (cardEl) cardEl.setAttribute("data-state", "scrolling");

                    touchStartX = e.clientX;
                    lastTouchX = touchStartX;
                    lastTouchTime = performance.now();
                    isDragging = true;
                    velocity = 0;
                    reelEl.classList.add("is-dragging");
                });

                window.addEventListener("mousemove", (e) => {
                    if (!isDragging) return;
                    const touchX = e.clientX;
                    const deltaX = lastTouchX - touchX;
                    const now = performance.now();
                    const dt = Math.max(1, now - lastTouchTime);
                    velocity = (deltaX / dt) * 16;
                    lastTouchX = touchX;
                    lastTouchTime = now;

                    currentT += deltaX;
                    renderTrack();
                });

                window.addEventListener("mouseup", () => {
                    if (!isDragging) return;
                    isDragging = false;
                    reelEl.classList.remove("is-dragging");
                    startMomentum();
                });
            }

            function syncStaticPosition() {
                if (currentState !== "scrolling") {
                    currentT = getTargetOffset(currentState);
                }
                renderTrack();
            }

            window.addEventListener("resize", syncStaticPosition);
            if (document.fonts && document.fonts.ready) {
                document.fonts.ready.then(syncStaticPosition);
            }

            // Initial render
            renderTrack();

            // Wire click listeners: provide choreographed transition (revolver roll -> hold highlight -> smooth exit fade -> navigation)
            let isNavigating = false;
            // Total time before changing pages (default 900ms). Can also be set via config.navigationDelay in config.js
            const NAVIGATION_DELAY_MS = (config.navigationDelay && typeof config.navigationDelay === "number")
                ? config.navigationDelay
                : 900;
            // Begins exit fade 350ms before navigation so the title stays highlighted on screen for the hold duration
            const EXIT_FADE_DELAY_MS = Math.max(200, NAVIGATION_DELAY_MS - 350);

            if (linksContainer) {
                linksContainer.addEventListener("click", (event) => {
                    const link = event.target.closest("a[data-reel], a[data-door]");
                    if (!link) return;

                    // Support keyboard modifiers (Cmd+Click, Ctrl+Click, Shift+Click) to open new tabs natively
                    if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) {
                        return;
                    }

                    event.preventDefault();
                    if (isNavigating) return;
                    isNavigating = true;

                    const targetKey = link.getAttribute("data-reel") || link.getAttribute("data-door");
                    const targetHref = link.getAttribute("href");

                    // 1. Immediately trigger the revolver to the target state
                    setReelState(targetKey);

                    // 2. Add active class for immediate tactile feedback
                    document.querySelectorAll(".gateway-link").forEach(l => l.classList.remove("is-selected"));
                    link.classList.add("is-selected");

                    // 3. Initiate graceful exit dissolve once the descriptor locks into position
                    setTimeout(() => {
                        const card = document.querySelector(".gateway-card");
                        const footer = document.querySelector(".gateway-footer");
                        if (card) card.classList.add("is-exiting");
                        if (footer) footer.classList.add("is-exiting");
                    }, EXIT_FADE_DELAY_MS);

                    // 4. Navigate as exit transition completes
                    setTimeout(() => {
                        window.location.href = targetHref;
                    }, NAVIGATION_DELAY_MS);
                });

                // Wire hover listeners with a 100ms grace period on mouseleave to avoid flicker
                linksContainer.addEventListener("mouseover", (event) => {
                    if (isNavigating) return;
                    const link = event.target.closest("a[data-reel], a[data-door]");
                    if (link) {
                        const targetKey = link.getAttribute("data-reel") || link.getAttribute("data-door");
                        setReelState(targetKey);
                    }
                });

                linksContainer.addEventListener("mouseleave", () => {
                    if (isNavigating) return;
                    leaveTimer = setTimeout(() => {
                        setReelState("resting");
                    }, 100);
                });

                // Mirror hover behavior for keyboard focus
                linksContainer.addEventListener("focusin", (event) => {
                    if (isNavigating) return;
                    const link = event.target.closest("a[data-reel], a[data-door]");
                    if (link) {
                        const targetKey = link.getAttribute("data-reel") || link.getAttribute("data-door");
                        setReelState(targetKey);
                    }
                });

                linksContainer.addEventListener("focusout", () => {
                    if (isNavigating) return;
                    leaveTimer = setTimeout(() => {
                        if (!linksContainer.contains(document.activeElement)) {
                            setReelState("resting");
                        }
                    }, 100);
                });
            }

            function resetGatewayState() {
                isNavigating = false;
                const card = document.querySelector(".gateway-card");
                const footer = document.querySelector(".gateway-footer");
                if (card) card.classList.remove("is-exiting");
                if (footer) footer.classList.remove("is-exiting");
                document.querySelectorAll(".gateway-link").forEach(l => l.classList.remove("is-selected"));
                if (!previewState && !previewItem) {
                    setReelState("resting");
                }
            }

            // Restore clean resting state on browser Back button (BFCache) or tab reactivate
            window.addEventListener("pageshow", () => {
                resetGatewayState();
            });

            document.addEventListener("visibilitychange", () => {
                if (document.visibilityState === "visible" && isNavigating) {
                    resetGatewayState();
                }
            });
        });
    </script>
</head>

<body>

    <div class="gateway-wrapper">

        <main class="gateway-card">
            <h1 class="gateway-title" id="gateway-title">
                <span class="gateway-static" id="gateway-static">
                    <span class="gateway-intro" id="gateway-intro">hi, i'm <span
                            class="gateway-name-accent">bilal</span>,</span>
                </span>
                <span class="gateway-reel" id="gateway-reel" data-state="resting" aria-hidden="true">
                    <span class="reel-baseline-anchor">the scientist</span>
                    <span class="reel-resting-phrase" id="reel-resting-phrase">a bit of everything</span>
                    <span class="reel-viewport" id="reel-viewport">
                        <span class="reel-track" id="reel-track">
                            <span class="reel-item reel-runner" id="reel-item-runner">the runner</span>
                            <span class="reel-item reel-cook" id="reel-item-cook">the cook</span>
                            <span class="reel-item reel-scientist" id="reel-item-scientist">the scientist</span>
                            <span class="reel-item reel-reader" id="reel-item-reader">the reader</span>
                        </span>
                    </span>
                </span>
            </h1>
            <div class="gateway-divider-line" aria-hidden="true"></div>
            <nav class="gateway-links" id="gateway-links" aria-label="Choose a space">
                <a href="office/" class="gateway-link gateway-link-office" data-reel="office"
                    data-door="office">office</a>
                <span class="gateway-divider" aria-hidden="true">/</span>
                <a href="kitchen/" class="gateway-link gateway-link-kitchen" data-reel="kitchen"
                    data-door="kitchen">kitchen</a>
            </nav>
        </main>

        <footer class="footer gateway-footer">
            <p>&copy; 2026 Bilal Abbasi. All rights reserved.</p>
        </footer>

    </div>

</body>

</html>
