<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../assets/favicon_ba_urdu_orange.png">
    <title>the kitchen</title>

    <!-- SEO Meta Tags -->
    <meta name="description" content="Bilal Abbasi's culinary corner. Sourdough baking, recipes, and food science.">
    <meta name="author" content="Bilal Abbasi">
    <meta name="robots" content="index, follow">

    <!-- Stylesheets: Controls how the website and kitchen look -->
    <link rel="stylesheet" href="../index.css">
    <link rel="stylesheet" href="../kitchen.css">

    <!-- Configuration Data: Shared config containing both professional and kitchen bio contents -->
    <script src="../config.js"></script>

    <!-- Markdown Parser Library: Vendored locally -->
    <script src="../assets/marked.min.js"></script>

    <!-- Navigation & Dynamic Content Controller: Automatically loads headers, menus, and ink interactions -->
    <script src="../nav.js" defer></script>

    <style>
        /* Centered holding page layout (self-contained, preserves index.css & kitchen.css untouched) */
        html,
        body {
            height: 100% !important;
            height: 100dvh !important;
            overflow: hidden !important;
        }

        .navbar:empty {
            display: none;
        }

        .wip-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            margin: auto;
            padding: 24px 0;
            width: 100%;
            max-width: 640px;
            flex: 1;
        }

        .wip-heading {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: clamp(16px, 3vh, 28px);
            gap: 6px;
        }

        .wip-heading .main-title,
        .wip-heading .main-subtitle {
            text-align: center;
            justify-content: center;
            display: block;
        }

        .wip-heading .main-title {
            font-size: clamp(2.8rem, 5vw, 3.5rem);
            letter-spacing: -1.2px;
            line-height: 1.15;
            min-height: auto;
        }

        .wip-heading .main-subtitle {
            font-size: clamp(1.4rem, 2.6vw, 2.1rem);
            color: var(--text-subtitle);
            white-space: normal;
            line-height: 1.25;
            min-height: auto;
        }

        .wip-sketch {
            max-width: 380px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .wip-sketch .sketch-img {
            max-height: clamp(200px, 38vh, 340px);
            width: auto;
            max-width: 100%;
            height: auto;
            object-fit: contain;
            display: block;
        }

        .wip-status {
            display: inline-flex;
            align-items: baseline;
            justify-content: center;
            gap: 12px;
            margin-top: clamp(14px, 2.4vh, 22px);
            font-family: var(--font-serif);
            font-size: clamp(1.15rem, 2vw, 1.45rem);
            color: var(--text-subtitle);
            text-align: center;
        }

        .wip-status-en {
            /* font-style: italic; */
            letter-spacing: 0.3px;
        }

        .wip-status-sep {
            color: var(--text-muted);
            font-weight: 300;
        }

        .wip-status-ur {
            font-family: 'Noto Nastaliq Urdu', 'Lora', serif;
            color: var(--color-urdu, #b83b14);
            font-size: 1.22em;
            line-height: 1.4;
        }

        /* Mobile Viewports: Strict single-page fit without vertical scrolling */
        @media (max-width: 900px) {

            html,
            body {
                height: 100% !important;
                height: 100dvh !important;
                overflow: hidden !important;
            }

            .app-wrapper {
                height: 100% !important;
                height: 100dvh !important;
                min-height: 100% !important;
                min-height: 100dvh !important;
                padding: 20px 20px 16px 20px !important;
                display: flex !important;
                flex-direction: column !important;
                justify-content: space-between !important;
                overflow: hidden !important;
                box-sizing: border-box !important;
            }

            .navbar {
                display: none !important;
            }

            .wip-wrapper {
                padding: 0 12px !important;
                margin: auto !important;
                flex: 1 !important;
                display: flex !important;
                flex-direction: column !important;
                justify-content: center !important;
                align-items: center !important;
            }

            .wip-heading {
                margin-bottom: clamp(12px, 2.2vh, 18px) !important;
                gap: 4px !important;
            }

            .wip-heading .main-title {
                font-size: clamp(2.1rem, 7.5vw, 2.65rem) !important;
                letter-spacing: -0.8px !important;
                line-height: 1.15 !important;
            }

            .wip-heading .main-subtitle {
                font-size: clamp(1.15rem, 4.2vw, 1.45rem) !important;
                white-space: normal !important;
                display: block !important;
                line-height: 1.3 !important;
            }

            .wip-sketch {
                max-width: min(280px, 70vw) !important;
            }

            .wip-sketch .sketch-img {
                max-height: clamp(160px, 32vh, 240px) !important;
            }

            .wip-status {
                margin-top: clamp(10px, 1.8vh, 16px) !important;
                gap: 8px !important;
                font-size: clamp(0.92rem, 3.6vw, 1.2rem) !important;
                white-space: nowrap !important;
            }

            .wip-status-ur {
                font-size: 1.2em !important;
            }

            .footer {
                margin-top: auto !important;
                justify-content: center !important;
                text-align: center !important;
                padding-bottom: env(safe-area-inset-bottom, 0px) !important;
            }
        }
    </style>
</head>

<body>
    <div class="app-wrapper">

        <!-- Header: Empty fixed-height header preserving vertical alignment with professional page -->
        <header class="navbar"></header>

        <!-- Main Content Area: Centered title and illustration -->
        <main class="wip-wrapper" id="me">

            <div class="heading-group wip-heading">
                <h1 class="main-title" id="main-title">the kitchen</h1>
                <h2 class="main-subtitle" id="main-subtitle">recipes from my childhood</h2>
            </div>

            <div class="sketch-container wip-sketch">
                <img src="../assets/kitchen_wip_3.png"
                    alt="Hand-drawn watercolor illustration of mortar and pestle with spices" class="sketch-img">
            </div>

            <div class="wip-status">
                <span class="wip-status-en">under construction</span>
                <span class="wip-status-sep">|</span>
                <span class="wip-status-ur" dir="rtl" lang="ur">کام چل رہا ہے</span>
            </div>

        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>&copy; 2026 Bilal Abbasi. All rights reserved.</p>
        </footer>

    </div>
</body>

</html>
