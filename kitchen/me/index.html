<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/favicon_ba_urdu_orange.png">
    <title>the kitchen</title>

    <!-- SEO Meta Tags -->
    <meta name="description" content="Bilal Abbasi's culinary corner. Sourdough baking, recipes, and food science.">
    <meta name="author" content="Bilal Abbasi">
    <meta name="robots" content="index, follow">

    <!-- Stylesheets: Controls how the website and kitchen look -->
    <link rel="stylesheet" href="../../index.css">
    <link rel="stylesheet" href="../../kitchen.css">

    <!-- Markdown Parser Library: Vendored locally -->
    <script src="../../assets/marked.min.js"></script>

    <!-- Configuration Data: Shared config containing both professional and kitchen bio contents -->
    <script src="../../config.js"></script>

    <!-- Loader Script: Automatically inserts the KITCHEN_CONFIG details when loaded -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Update browser tab title
            if (typeof KITCHEN_CONFIG !== 'undefined') {
                document.title = (KITCHEN_CONFIG.name || "the kitchen") + " — us";
            }

            // Load "us" content dynamically from us.md
            const usSpaceEl = document.getElementById("us-content");
            if (usSpaceEl) {
                fetch("us.md")
                    .then(res => {
                        if (!res.ok) throw new Error("Could not fetch us.md");
                        return res.text();
                    })
                    .then(markdown => {
                        if (typeof marked !== "undefined" && marked.parse) {
                            usSpaceEl.innerHTML = marked.parse(markdown);
                        } else {
                            usSpaceEl.innerHTML = markdown
                                .trim()
                                .split(/\n\s*\n/)
                                .map(para => `<p>${para.trim().replace(/\n/g, "<br>")}</p>`)
                                .join("");
                        }
                    })
                    .catch(err => {
                        console.warn("Using inline fallback content for this space:", err);
                    });
            }
        });
    </script>
</head>

<body>
    <div class="app-wrapper">

        <!-- Header: Top bar with navigation for kitchen sections -->
        <header class="navbar">
            <ul class="nav-links">
                <li class="nav-item"><a href="../" class="nav-focal">the kitchen</a></li>
                <li class="nav-divider" aria-hidden="true">|</li>
                <li class="nav-item"><a href="../culture/">July 17, 1987</a></li>
                <li class="nav-item"><a href="./" class="nav-home">us</a></li>
            </ul>
        </header>

        <!-- About / Me Section -->
        <section class="about-section" id="me">
            <h2 class="about-title">us</h2>

            <div class="about-grid">
                <div class="about-column about-text" id="us-content"></div>
                <div class="about-column">
                    <img class="about-img" src="../../assets/photos/bilal_baby.png"
                        alt="Picture of Bilal's mom holding him in the kitchen sink.">
                </div>
            </div>

        </section>

        <!-- Footer -->
        <footer class="footer">
            <p>&copy; 2026 Bilal Abbasi. All rights reserved.</p>
        </footer>

    </div>
</body>

</html>
