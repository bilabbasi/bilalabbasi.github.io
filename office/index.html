<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../assets/favicon_ba.png">
    <title>Bilal Abbasi</title>

    <!-- SEO Meta Tags - Helps Google find the site -->
    <meta name="description" content="Bilal Abbasi — Research Scientist (PhD, McGill) working on AI-based video compression and deep learning for meshes.">
    <meta name="author" content="Bilal Abbasi">
    <meta name="robots" content="index, follow">

    <!-- Fonts: Lora & Inter (loaded via <link> without Urdu font on English-only page) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap">

    <!-- Stylesheet: Controls how the website looks (colors, fonts, sizes) -->
    <link rel="stylesheet" href="../index.css">

    <!-- Configuration Data: Where your text and links are defined -->
    <script src="../config.js"></script>

    <!-- Loader Script: Automatically inserts the data from config.js -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Sync hover accent with "the scientist" color in config.js
            const scientistItem = (typeof GATEWAY_CONFIG !== "undefined" && GATEWAY_CONFIG.reel && Array.isArray(GATEWAY_CONFIG.reel.items))
                ? GATEWAY_CONFIG.reel.items.find(it => it.id === "scientist" || it.target === "office")
                : null;
            if (scientistItem && scientistItem.color) {
                document.documentElement.style.setProperty("--scientist-color", scientistItem.color);
            }

            // 1. Update browser tab title & icon size knob from config.js
            document.title = OFFICE_CONFIG.name;
            if (typeof OFFICE_CONFIG.iconSize === "number" && OFFICE_CONFIG.iconSize > 0) {
                document.documentElement.style.setProperty("--office-icon-size", `${OFFICE_CONFIG.iconSize}px`);
            }

            // 2. Set name and subtitle immediately
            const nameEl = document.getElementById("name-text");
            if (nameEl) nameEl.textContent = OFFICE_CONFIG.name || "Bilal Abbasi";

            const titleEl = document.getElementById("title-text");
            if (titleEl) titleEl.textContent = OFFICE_CONFIG.subtitle || "Research Scientist, PhD";

            // 3. Set bio text and append contact trigger from config
            const contactLabel = (OFFICE_CONFIG.contact && OFFICE_CONFIG.contact.label) || "Get in touch.";
            const bioEl = document.getElementById("bio-text");
            if (bioEl) {
                bioEl.innerHTML = `${OFFICE_CONFIG.bio}\n\n<button type="button" class="bio-contact-trigger" id="contact-trigger">${contactLabel}</button>`;
            }
            const modalTitleEl = document.getElementById("contact-modal-title");
            if (modalTitleEl) {
                modalTitleEl.textContent = contactLabel.replace(/\.$/, "");
            }

            // 4. Generate the social/profile links dynamically with animated platform icons
            function getExternalLinkIcon(link) {
                const key = `${link.label || ""} ${link.url || ""}`.toLowerCase();
                if (key.includes("linkedin")) {
                    return `
                        <svg class="external-link-icon icon-linkedin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                            <rect class="icon-li-frame" x="3" y="3" width="18" height="18" rx="3.5"></rect>
                            <line class="icon-li-stem" x1="8" y1="11" x2="8" y2="16.5"></line>
                            <circle class="icon-li-dot" cx="8" cy="7.75" r="1.05" fill="currentColor" stroke="none"></circle>
                            <path class="icon-li-arch" d="M12 16.5v-5.5m0 2.1c0-1.35 1.05-2.2 2.3-2.2 1.35 0 2.2.85 2.2 2.45v3.15"></path>
                        </svg>`;
                }
                if (key.includes("scholar")) {
                    return `
                        <svg class="external-link-icon icon-scholar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                            <g class="icon-sch-cap-group">
                                <path class="icon-sch-cap" d="M2.5 9.5L12 5l9.5 4.5L12 14 2.5 9.5z"></path>
                            </g>
                            <path class="icon-sch-base" d="M6.5 11.7v4.4c0 1.4 2.5 2.7 5.5 2.7s5.5-1.3 5.5-2.7v-4.4"></path>
                            <g class="icon-sch-tassel">
                                <line x1="20" y1="10.2" x2="20" y2="15.8"></line>
                                <circle cx="20" cy="16.8" r="1.05" fill="currentColor" stroke="none"></circle>
                            </g>
                        </svg>`;
                }
                if (key.includes("github")) {
                    return `
                        <svg class="external-link-icon icon-github" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                            <path class="icon-gh-tail" d="M9 18.2c-3.8 1.25-4.3-1.85-5.7-2.2"></path>
                            <path class="icon-gh-body" d="M15 21v-3.2c0-.95-.35-1.6-.75-2 2.7-.3 5.5-1.35 5.5-6 0-1.3-.45-2.4-1.25-3.25.12-.32.55-1.6-.12-3.3 0 0-1-.32-3.38 1.25a11.7 11.7 0 0 0-6 0C6.62 2.93 5.62 3.25 5.62 3.25c-.67 1.7-.24 2.98-.12 3.3-.8.85-1.25 1.95-1.25 3.25 0 4.65 2.8 5.7 5.5 6-.4.38-.75 1.05-.75 2V21"></path>
                        </svg>`;
                }
                return `
                    <svg class="external-link-icon icon-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                        <line x1="7" y1="17" x2="17" y2="7"></line>
                        <polyline points="7 7 17 7 17 17"></polyline>
                    </svg>`;
            }

            const linksList = document.getElementById("links-list");
            if (linksList && OFFICE_CONFIG.links) {
                linksList.innerHTML = OFFICE_CONFIG.links.map(link => `
                    <a href="${link.url}" target="_blank" rel="noopener noreferrer" class="external-link" aria-label="${link.label}">
                        ${getExternalLinkIcon(link)}
                        <span class="external-link-label"><span>${link.label}</span></span>
                    </a>
                `).join("");
            }

            // 5. Wire up contact message modal with JS-obfuscated mailto delivery
            const trigger = document.getElementById("contact-trigger");
            const modal = document.getElementById("contact-modal");
            const closeBtn = document.getElementById("contact-close");
            const form = document.getElementById("contact-form");
            const nameInput = document.getElementById("contact-name");
            const messageInput = document.getElementById("contact-message");
            const fallbackBox = document.getElementById("contact-fallback");
            const mailtoLink = document.getElementById("contact-mailto-link");
            const gmailLink = document.getElementById("contact-gmail-link");
            const copyBtn = document.getElementById("contact-copy-btn");

            function decodeContactEmail() {
                const cfg = OFFICE_CONFIG.contact;
                if (!cfg || !Array.isArray(cfg.codes)) return "";
                return cfg.codes.map(c => String.fromCharCode(c ^ cfg.key)).join("");
            }

            function getModalFocusables() {
                if (!modal) return [];
                return Array.from(modal.querySelectorAll('a[href], button:not([disabled]), input:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'))
                    .filter(el => !el.closest('[hidden]') && el.offsetParent !== null);
            }

            function openModal() {
                if (!modal) return;
                if (fallbackBox) fallbackBox.hidden = true;
                if (form) form.hidden = false;
                modal.classList.add("is-open");
                modal.setAttribute("aria-hidden", "false");
                const firstField = nameInput || messageInput;
                if (firstField) setTimeout(() => firstField.focus(), 50);
            }

            function closeModal() {
                if (!modal) return;
                modal.classList.remove("is-open");
                modal.setAttribute("aria-hidden", "true");
                if (trigger) trigger.focus();
            }

            if (trigger && modal) {
                trigger.addEventListener("click", openModal);
                if (closeBtn) closeBtn.addEventListener("click", closeModal);
                modal.addEventListener("click", (e) => {
                    if (e.target === modal) closeModal();
                });
                document.addEventListener("keydown", (e) => {
                    if (!modal.classList.contains("is-open")) return;
                    if (e.key === "Escape") {
                        closeModal();
                        return;
                    }
                    if (e.key === "Tab") {
                        const focusables = getModalFocusables();
                        if (focusables.length === 0) return;
                        const first = focusables[0];
                        const last = focusables[focusables.length - 1];
                        if (e.shiftKey) {
                            if (document.activeElement === first || !modal.contains(document.activeElement)) {
                                e.preventDefault();
                                last.focus();
                            }
                        } else if (document.activeElement === last || !modal.contains(document.activeElement)) {
                            e.preventDefault();
                            first.focus();
                        }
                    }
                });
            }

            if (form) {
                form.addEventListener("submit", (e) => {
                    e.preventDefault();
                    const recipient = decodeContactEmail();
                    if (!recipient) return;

                    const name = (document.getElementById("contact-name")?.value || "").trim();
                    const subject = (document.getElementById("contact-subject")?.value || "").trim() || "Hello from bilalabbasi.com";
                    const rawBody = (messageInput?.value || "").trim();
                    const body = name ? `${rawBody}\n\n— ${name}` : rawBody;

                    const mailtoUrl = `mailto:${recipient}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
                    const gmailUrl = `https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(recipient)}&su=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;

                    // Trigger native mail client via synthetic anchor click (more reliable than location.href)
                    const a = document.createElement("a");
                    a.href = mailtoUrl;
                    a.style.display = "none";
                    document.body.appendChild(a);
                    a.click();
                    a.remove();

                    // Show fallback options in case the browser/OS has no default mailto: handler
                    if (mailtoLink) mailtoLink.href = mailtoUrl;
                    if (gmailLink) gmailLink.href = gmailUrl;
                    if (copyBtn) {
                        copyBtn.textContent = "Copy email";
                        copyBtn.onclick = async () => {
                            try {
                                await navigator.clipboard.writeText(recipient);
                                copyBtn.textContent = "Copied!";
                            } catch {
                                copyBtn.textContent = recipient;
                            }
                        };
                    }
                    form.hidden = true;
                    if (fallbackBox) fallbackBox.hidden = false;
                    form.reset();
                });
            }
        });
    </script>
</head>

<body>

    <!-- Main wrapper holding the header, main content, and footer -->
    <div class="app-wrapper">

        <!-- Header: Fixed-height spacer preserving vertical alignment stability -->
        <header class="navbar" aria-hidden="true"></header>

        <!-- Main Content Area: Split into two columns -->
        <main class="main-content office-content" id="me">

            <!-- Left Column: Biography headings and list of links -->
            <div class="info-column">
                <div class="heading-group">
                    <h1 class="main-title" id="main-title"><span id="name-text"></span></h1>
                    <h2 class="main-subtitle" id="main-subtitle"><span id="title-text"></span></h2>
                </div>

                <!-- Main bio paragraph text (populated by JavaScript loader) -->
                <p class="bio-paragraph" id="bio-text"></p>

                <!-- Container where the social/office links will be loaded -->
                <div class="external-links" id="links-list">
                    <!-- Links list will be injected here -->
                </div>
            </div>

            <!-- Right Column: Visual Sketch illustration -->
            <div class="visual-column">
                <div class="sketch-container office-sketch">
                    <img src="../assets/office/watercolor_office_image_transparent.png"
                        alt="Watercolor illustration of a raccoon mapped through layered mathematical manifolds" class="sketch-img">
                </div>
            </div>

        </main>

        <!-- Footer: Copyright line at the bottom -->
        <footer class="footer">
            <p>&copy; 2026 Bilal Abbasi. All rights reserved.</p>
        </footer>

    </div>

    <!-- Minimalist Contact Message Modal -->
    <div class="contact-modal" id="contact-modal" role="dialog" aria-modal="true" aria-labelledby="contact-modal-title" aria-hidden="true">
        <div class="contact-modal-card">
            <div class="contact-modal-header">
                <h2 class="contact-modal-title" id="contact-modal-title"></h2>
                <button type="button" class="contact-modal-close" id="contact-close" aria-label="Close message box">&times;</button>
            </div>
            <form class="contact-form" id="contact-form">
                <label class="contact-field">
                    <span class="contact-label">name</span>
                    <input type="text" id="contact-name" class="contact-input" placeholder="Optional" autocomplete="name">
                </label>
                <label class="contact-field">
                    <span class="contact-label">subject</span>
                    <input type="text" id="contact-subject" class="contact-input" placeholder="Hello from bilalabbasi.com">
                </label>
                <label class="contact-field">
                    <span class="contact-label">message</span>
                    <textarea id="contact-message" class="contact-textarea" rows="4" placeholder="Write your message..." required></textarea>
                </label>
                <div class="contact-actions">
                    <button type="submit" class="contact-submit">Send message</button>
                </div>
            </form>
            <div class="contact-fallback" id="contact-fallback" hidden>
                <p class="contact-fallback-note">Your mail app should open with this draft. If nothing opened, choose an option below:</p>
                <div class="contact-fallback-actions">
                    <a id="contact-gmail-link" class="contact-submit" target="_blank" rel="noopener noreferrer">Open in Gmail</a>
                    <a id="contact-mailto-link" class="contact-secondary-btn">Open mail app</a>
                    <button type="button" id="contact-copy-btn" class="contact-secondary-btn">Copy email</button>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
