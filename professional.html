<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/favicon_ba.png">
    <title>Bilal Abbasi</title>

    <!-- SEO Meta Tags - Helps Google find the site -->
    <meta name="description" content="Personal space of Bilal Abbasi. Focused on systems engineering and research.">
    <meta name="author" content="Bilal Abbasi">
    <meta name="robots" content="index, follow">

    <!-- Stylesheet: Controls how the website looks (colors, fonts, sizes) -->
    <link rel="stylesheet" href="index.css">

    <!-- Configuration Data: Where your text and links are defined -->
    <script src="config.js"></script>

    <!-- Loader Script: Automatically inserts the data from config.js and animates typing -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // 1. Update browser tab title
            document.title = PROFESSIONAL_CONFIG.name;

            // 2. Set bio text
            document.getElementById("bio-text").textContent = PROFESSIONAL_CONFIG.bio;

            // 3. Generate the social/profile links dynamically
            const linksList = document.getElementById("links-list");
            linksList.innerHTML = PROFESSIONAL_CONFIG.links.map(link => `
                <a href="${link.url}" target="_blank" rel="noopener noreferrer" class="external-link">
                    ${link.label}
                    <!-- Inline SVG: Creates the small arrow icon pointing top-right (↗) next to links -->
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="7" y1="17" x2="17" y2="7"></line>
                        <polyline points="7 7 17 7 17 17"></polyline>
                    </svg>
                </a>
            `).join("");

            // 4. Typewriter animation for name and subtitle
            const nameEl = document.getElementById("name-text");
            const nameCursor = document.getElementById("name-cursor");
            const titleEl = document.getElementById("title-text");
            const titleCursor = document.getElementById("title-cursor");
            const fadeElements = document.querySelectorAll(".profile-fade");

            const nameToType = PROFESSIONAL_CONFIG.name || "Bilal Abbasi";
            const subtitleToType = PROFESSIONAL_CONFIG.subtitle || "Research Scientist, PhD";

            let nameIndex = 0;
            let subtitleIndex = 0;

            function typeName() {
                if (nameIndex < nameToType.length) {
                    nameEl.textContent += nameToType.charAt(nameIndex);
                    nameIndex++;
                    setTimeout(typeName, 60 + Math.random() * 30);
                } else {
                    setTimeout(() => {
                        if (nameCursor) nameCursor.style.display = "none";
                        if (titleCursor) titleCursor.style.display = "inline-block";
                        typeSubtitle();
                    }, 220);
                }
            }

            function typeSubtitle() {
                if (subtitleIndex < subtitleToType.length) {
                    const char = subtitleToType.charAt(subtitleIndex);
                    titleEl.textContent += char;
                    subtitleIndex++;
                    let delay = 45 + Math.random() * 25;
                    if (char === ',') delay += 180;
                    setTimeout(typeSubtitle, delay);
                } else {
                    if (titleCursor) titleCursor.classList.add("finished");
                    fadeElements.forEach(el => el.classList.add("visible"));
                }
            }

            setTimeout(typeName, 250);
        });
    </script>
</head>

<body>

    <!-- Main wrapper holding the header, main content, and footer -->
    <div class="app-wrapper">

        <!-- Header: Fixed-height navbar preserving vertical alignment stability -->
        <header class="navbar">
            <ul class="nav-links">
                <li class="nav-item"><a href="index.html" class="nav-home">home</a></li>
            </ul>
        </header>

        <!-- Main Content Area: Split into two columns -->
        <main class="main-content" id="me">

            <!-- Left Column: Biography headings and list of links -->
            <div class="info-column">
                <div class="heading-group">
                    <h1 class="main-title" id="main-title"><span id="name-text"></span><span class="typewriter-cursor" id="name-cursor">|</span></h1>
                    <h2 class="main-subtitle" id="main-subtitle"><span id="title-text"></span><span class="typewriter-cursor" id="title-cursor" style="display: none;">|</span></h2>
                </div>

                <!-- Main bio paragraph text (populated by JavaScript loader) -->
                <p class="bio-paragraph profile-fade" id="bio-text">loading...</p>

                <!-- Container where the social/professional links will be loaded -->
                <div class="external-links profile-fade" id="links-list">
                    <!-- Links list will be injected here -->
                </div>
            </div>

            <!-- Right Column: Visual Sketch illustration -->
            <div class="visual-column">
                <div class="sketch-container">
                    <img src="assets/professional/sketch_colour.png" alt="Conceptual mechanical line illustration"
                        class="sketch-img">
                </div>
            </div>

        </main>

        <!-- Footer: Copyright line at the bottom -->
        <footer class="footer">
            <p>&copy; 2026 Bilal Abbasi. All rights reserved.</p>
        </footer>

    </div>

</body>

</html>
