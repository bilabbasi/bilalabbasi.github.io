<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../assets/favicon_ba.png">
    <title>Bilal Abbasi</title>

    <!-- SEO Meta Tags - Helps Google find the site -->
    <meta name="description" content="Personal space of Bilal Abbasi. Focused on systems engineering and research.">
    <meta name="author" content="Bilal Abbasi">
    <meta name="robots" content="index, follow">

    <!-- Stylesheet: Controls how the website looks (colors, fonts, sizes) -->
    <link rel="stylesheet" href="../index.css">

    <!-- Configuration Data: Where your text and links are defined -->
    <script src="../config.js"></script>

    <!-- Loader Script: Automatically inserts the data from config.js -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Sync hover accent with "the scientist" color in config.js
            const scientistItem = (typeof GATEWAY_CONFIG !== "undefined" && GATEWAY_CONFIG.reel && Array.isArray(GATEWAY_CONFIG.reel.items))
                ? GATEWAY_CONFIG.reel.items.find(it => it.id === "scientist" || it.target === "professional")
                : null;
            if (scientistItem && scientistItem.color) {
                document.documentElement.style.setProperty("--scientist-color", scientistItem.color);
            }

            // 1. Update browser tab title
            document.title = PROFESSIONAL_CONFIG.name;

            // 2. Set name and subtitle immediately
            const nameEl = document.getElementById("name-text");
            if (nameEl) nameEl.textContent = PROFESSIONAL_CONFIG.name || "Bilal Abbasi";

            const titleEl = document.getElementById("title-text");
            if (titleEl) titleEl.textContent = PROFESSIONAL_CONFIG.subtitle || "Research Scientist, PhD";

            // 3. Set bio text
            const bioEl = document.getElementById("bio-text");
            if (bioEl) bioEl.innerHTML = PROFESSIONAL_CONFIG.bio;

            // 4. Generate the social/profile links dynamically
            const linksList = document.getElementById("links-list");
            if (linksList && PROFESSIONAL_CONFIG.links) {
                linksList.innerHTML = PROFESSIONAL_CONFIG.links.map(link => `
                    <a href="${link.url}" target="_blank" rel="noopener noreferrer" class="external-link">
                        ${link.label}
                        <!-- Inline SVG: Creates the small arrow icon pointing top-right (↗) next to links -->
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="7" y1="17" x2="17" y2="7"></line>
                            <polyline points="7 7 17 7 17 17"></polyline>
                        </svg>
                    </a>
                `).join("");
            }

            // 5. Wire up "Let's get to work." message modal with JS-obfuscated mailto delivery
            const trigger = document.getElementById("contact-trigger");
            const modal = document.getElementById("contact-modal");
            const closeBtn = document.getElementById("contact-close");
            const form = document.getElementById("contact-form");
            const messageInput = document.getElementById("contact-message");
            const fallbackBox = document.getElementById("contact-fallback");
            const mailtoLink = document.getElementById("contact-mailto-link");
            const gmailLink = document.getElementById("contact-gmail-link");
            const copyBtn = document.getElementById("contact-copy-btn");

            function decodeContactEmail() {
                const cfg = PROFESSIONAL_CONFIG.contact;
                if (!cfg || !Array.isArray(cfg.codes)) return "";
                return cfg.codes.map(c => String.fromCharCode(c ^ cfg.key)).join("");
            }

            function openModal() {
                if (!modal) return;
                if (fallbackBox) fallbackBox.hidden = true;
                if (form) form.hidden = false;
                modal.classList.add("is-open");
                modal.setAttribute("aria-hidden", "false");
                if (messageInput) setTimeout(() => messageInput.focus(), 50);
            }

            function closeModal() {
                if (!modal) return;
                modal.classList.remove("is-open");
                modal.setAttribute("aria-hidden", "true");
                if (trigger) trigger.focus();
            }

            if (trigger && modal) {
                trigger.addEventListener("click", openModal);
                if (closeBtn) closeBtn.addEventListener("click", closeModal);
                modal.addEventListener("click", (e) => {
                    if (e.target === modal) closeModal();
                });
                document.addEventListener("keydown", (e) => {
                    if (e.key === "Escape" && modal.classList.contains("is-open")) {
                        closeModal();
                    }
                });
            }

            if (form) {
                form.addEventListener("submit", (e) => {
                    e.preventDefault();
                    const recipient = decodeContactEmail();
                    if (!recipient) return;

                    const name = (document.getElementById("contact-name")?.value || "").trim();
                    const subject = (document.getElementById("contact-subject")?.value || "").trim() || "Hello from bilalabbasi.com";
                    const rawBody = (messageInput?.value || "").trim();
                    const body = name ? `${rawBody}\n\n— ${name}` : rawBody;

                    const mailtoUrl = `mailto:${recipient}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
                    const gmailUrl = `https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(recipient)}&su=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;

                    // Trigger native mail client via synthetic anchor click (more reliable than location.href)
                    const a = document.createElement("a");
                    a.href = mailtoUrl;
                    a.style.display = "none";
                    document.body.appendChild(a);
                    a.click();
                    a.remove();

                    // Show fallback options in case the browser/OS has no default mailto: handler
                    if (mailtoLink) mailtoLink.href = mailtoUrl;
                    if (gmailLink) gmailLink.href = gmailUrl;
                    if (copyBtn) {
                        copyBtn.textContent = "copy email";
                        copyBtn.onclick = async () => {
                            try {
                                await navigator.clipboard.writeText(recipient);
                                copyBtn.textContent = "copied!";
                            } catch {
                                copyBtn.textContent = recipient;
                            }
                        };
                    }
                    form.hidden = true;
                    if (fallbackBox) fallbackBox.hidden = false;
                    form.reset();
                });
            }
        });
    </script>
</head>

<body>

    <!-- Main wrapper holding the header, main content, and footer -->
    <div class="app-wrapper">

        <!-- Header: Fixed-height navbar preserving vertical alignment stability -->
        <header class="navbar"></header>

        <!-- Main Content Area: Split into two columns -->
        <main class="main-content professional-content" id="me">

            <!-- Left Column: Biography headings and list of links -->
            <div class="info-column">
                <div class="heading-group">
                    <h1 class="main-title" id="main-title"><span id="name-text"></span></h1>
                    <h2 class="main-subtitle" id="main-subtitle"><span id="title-text"></span></h2>
                </div>

                <!-- Main bio paragraph text (populated by JavaScript loader) -->
                <p class="bio-paragraph" id="bio-text"></p>

                <!-- Container where the social/professional links will be loaded -->
                <div class="external-links" id="links-list">
                    <!-- Links list will be injected here -->
                </div>
            </div>

            <!-- Right Column: Visual Sketch illustration -->
            <div class="visual-column">
                <div class="sketch-container professional-sketch">
                    <img src="../assets/professional/watercolor_professional_image_transparent.png"
                        alt="Conceptual mechanical line illustration" class="sketch-img">
                </div>
            </div>

        </main>

        <!-- Footer: Copyright line at the bottom -->
        <footer class="footer">
            <p>&copy; 2026 Bilal Abbasi. All rights reserved.</p>
        </footer>

    </div>

    <!-- Minimalist Contact Message Modal -->
    <div class="contact-modal" id="contact-modal" role="dialog" aria-modal="true" aria-labelledby="contact-modal-title" aria-hidden="true">
        <div class="contact-modal-card">
            <div class="contact-modal-header">
                <h2 class="contact-modal-title" id="contact-modal-title">let's get to work</h2>
                <button type="button" class="contact-modal-close" id="contact-close" aria-label="Close message box">&times;</button>
            </div>
            <form class="contact-form" id="contact-form">
                <label class="contact-field">
                    <span class="contact-label">name</span>
                    <input type="text" id="contact-name" class="contact-input" placeholder="optional" autocomplete="name">
                </label>
                <label class="contact-field">
                    <span class="contact-label">subject</span>
                    <input type="text" id="contact-subject" class="contact-input" placeholder="Hello from bilalabbasi.com">
                </label>
                <label class="contact-field">
                    <span class="contact-label">message</span>
                    <textarea id="contact-message" class="contact-textarea" rows="4" placeholder="Write your message..." required></textarea>
                </label>
                <div class="contact-actions">
                    <button type="submit" class="contact-submit">send message</button>
                </div>
            </form>
            <div class="contact-fallback" id="contact-fallback" hidden>
                <p class="contact-fallback-note">Your mail app should open with this draft. If nothing opened, choose an option below:</p>
                <div class="contact-fallback-actions">
                    <a id="contact-gmail-link" class="contact-submit" target="_blank" rel="noopener noreferrer">open in Gmail</a>
                    <a id="contact-mailto-link" class="contact-secondary-btn">open mail app</a>
                    <button type="button" id="contact-copy-btn" class="contact-secondary-btn">copy email</button>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
