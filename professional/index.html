<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../assets/favicon_ba.png">
    <title>Bilal Abbasi</title>

    <!-- SEO Meta Tags - Helps Google find the site -->
    <meta name="description" content="Personal space of Bilal Abbasi. Focused on systems engineering and research.">
    <meta name="author" content="Bilal Abbasi">
    <meta name="robots" content="index, follow">

    <!-- Stylesheet: Controls how the website looks (colors, fonts, sizes) -->
    <link rel="stylesheet" href="../index.css">

    <!-- Configuration Data: Where your text and links are defined -->
    <script src="../config.js"></script>

    <!-- Loader Script: Automatically inserts the data from config.js -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // 1. Update browser tab title
            document.title = PROFESSIONAL_CONFIG.name;

            // 2. Set name and subtitle immediately
            const nameEl = document.getElementById("name-text");
            if (nameEl) nameEl.textContent = PROFESSIONAL_CONFIG.name || "Bilal Abbasi";

            const titleEl = document.getElementById("title-text");
            if (titleEl) titleEl.textContent = PROFESSIONAL_CONFIG.subtitle || "Research Scientist, PhD";

            // 3. Set bio text
            const bioEl = document.getElementById("bio-text");
            if (bioEl) bioEl.innerHTML = PROFESSIONAL_CONFIG.bio;

            // 4. Generate the social/profile links dynamically
            const linksList = document.getElementById("links-list");
            if (linksList && PROFESSIONAL_CONFIG.links) {
                linksList.innerHTML = PROFESSIONAL_CONFIG.links.map(link => `
                    <a href="${link.url}" target="_blank" rel="noopener noreferrer" class="external-link">
                        ${link.label}
                        <!-- Inline SVG: Creates the small arrow icon pointing top-right (↗) next to links -->
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="7" y1="17" x2="17" y2="7"></line>
                            <polyline points="7 7 17 7 17 17"></polyline>
                        </svg>
                    </a>
                `).join("");
            }
        });
    </script>
</head>

<body>

    <!-- Main wrapper holding the header, main content, and footer -->
    <div class="app-wrapper">

        <!-- Header: Fixed-height navbar preserving vertical alignment stability -->
        <header class="navbar"></header>

        <!-- Main Content Area: Split into two columns -->
        <main class="main-content professional-content" id="me">

            <!-- Left Column: Biography headings and list of links -->
            <div class="info-column">
                <div class="heading-group">
                    <h1 class="main-title" id="main-title"><span id="name-text"></span></h1>
                    <h2 class="main-subtitle" id="main-subtitle"><span id="title-text"></span></h2>
                </div>

                <!-- Main bio paragraph text (populated by JavaScript loader) -->
                <p class="bio-paragraph" id="bio-text"></p>

                <!-- Container where the social/professional links will be loaded -->
                <div class="external-links" id="links-list">
                    <!-- Links list will be injected here -->
                </div>
            </div>

            <!-- Right Column: Visual Sketch illustration -->
            <div class="visual-column">
                <div class="sketch-container professional-sketch">
                    <img src="../assets/professional/watercolor_professional_image_transparent.png"
                        alt="Conceptual mechanical line illustration" class="sketch-img">
                </div>
            </div>

        </main>

        <!-- Footer: Copyright line at the bottom -->
        <footer class="footer">
            <p>&copy; 2026 Bilal Abbasi. All rights reserved.</p>
        </footer>

    </div>

</body>

</html>
